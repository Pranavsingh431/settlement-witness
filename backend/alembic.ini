# Alembic configuration.
#
# The database URL is not set here. It is supplied by the code that runs a
# migration, so the same migrations apply to a developer file, a temporary test
# database and an evaluation run without one of them silently picking up
# another's connection string.

[alembic]
script_location = migrations
prepend_sys_path = .
# path_separator, not the deprecated version_path_separator. The old key
# makes Alembic fall back to splitting paths on spaces and colons, and warn
# about it, which this project treats as an error.
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARNING
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
