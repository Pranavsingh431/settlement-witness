name: CI

# Every action is pinned to a full commit SHA, with the release it corresponds
# to in the trailing comment.
#
# A git tag is a mutable reference. Whoever controls the action repository can
# move it to point at different code, and the pipeline would pick that code up
# without anything in this file changing. A commit SHA names the exact tree that
# was reviewed, so the pipeline runs the same code every time. Floating major
# tags have the same problem and are also not always published: astral-sh/setup-uv
# has no v10 tag at all.
#
# The trailing comment is what makes the pin readable. Dependabot reads it,
# bumps the SHA and the comment together, and opens a weekly pull request. So
# these stay current without giving up the pin.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install the locked dependencies
        run: uv sync --all-groups --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check lint rules
        run: uv run ruff check --output-format=github .

      - name: Type check
        run: uv run mypy

      - name: Run tests
        run: uv run pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: frontend/package.json

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install the locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Check lint rules
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

      - name: Build the production bundle
        run: pnpm run build

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan the repository with gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Audit the backend dependencies
        working-directory: backend
        run: |
          uv sync --all-groups --frozen
          uv run --with pip-audit pip-audit

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: frontend/package.json

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc

      - name: Audit the frontend dependencies
        working-directory: frontend
        run: pnpm audit --audit-level moderate

  containers:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          push: false
          load: true
          tags: settlement-witness-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./frontend
          target: runtime
          push: false
          load: true
          tags: settlement-witness-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building an image does not prove it runs. Both images are started from
      # the exact tags built above, then checked for behaviour and for the user
      # they run as. The frontend is published on 8080 because its container
      # listens on 8080, which is what the unprivileged nginx image requires.
      - name: Start both containers
        run: |
          set -euo pipefail
          docker run --detach --name backend-check \
            --env SW_APP_ENV=ci \
            --publish 8000:8000 \
            settlement-witness-backend:ci
          docker run --detach --name frontend-check \
            --publish 8080:8080 \
            settlement-witness-frontend:ci
          docker ps --all --filter name=-check \
            --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'

      - name: Check that both containers serve and run unprivileged
        run: |
          set -euo pipefail

          readonly ATTEMPTS=30

          check_http() {
            local name="$1" url="$2" container="$3" attempt status
            status=""
            for attempt in $(seq 1 "${ATTEMPTS}"); do
              status="$(curl --silent --output /dev/null --write-out '%{http_code}' "${url}" || true)"
              if [ "${status}" = "200" ]; then
                echo "ok: ${name} returned 200 from ${url} on attempt ${attempt}"
                return 0
              fi
              sleep 2
            done
            echo "failed: ${name} never returned 200 from ${url}. Last status was '${status}'."
            echo "--- ${container} logs ---"
            docker logs "${container}" 2>&1 | tail -50
            return 1
          }

          check_non_root() {
            local container="$1" uid
            uid="$(docker exec "${container}" id -u 2>/dev/null | tr -d '[:space:]')"
            if [ -z "${uid}" ]; then
              echo "failed: could not read the UID inside ${container}."
              echo "--- ${container} logs ---"
              docker logs "${container}" 2>&1 | tail -50
              return 1
            fi
            if [ "${uid}" = "0" ]; then
              echo "failed: ${container} runs as root. UID is ${uid}, which must not be 0."
              return 1
            fi
            echo "ok: ${container} runs as UID ${uid}, which is not root"
          }

          check_http "backend health" \
            "http://127.0.0.1:8000/health" backend-check
          check_http "frontend index" \
            "http://127.0.0.1:8080/" frontend-check
          check_http "frontend single page fallback" \
            "http://127.0.0.1:8080/an/unknown/client/route" frontend-check

          check_non_root backend-check
          check_non_root frontend-check

          echo "Both container images start, serve and run unprivileged."

      - name: Collect container diagnostics
        if: failure()
        run: |
          docker ps --all --filter name=-check \
            --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
          for container in backend-check frontend-check; do
            echo "--- ${container} logs ---"
            docker logs "${container}" 2>&1 | tail -100 || true
          done

      - name: Remove both containers
        if: always()
        run: |
          for container in backend-check frontend-check; do
            docker rm --force "${container}" >/dev/null 2>&1 || true
          done
