server {
    # 8080, not 80. The container runs as UID 101, and an unprivileged
    # process cannot bind a port below 1024. docker-compose.yml maps the host
    # port 5173 onto this one.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, which is what resolves the name of another service
    # on a user-defined network such as the one Compose creates.
    #
    # It is named here because the upstream below is passed through a variable,
    # and a variable upstream is resolved per request rather than once at
    # startup. That matters: with the host written literally, nginx resolves it
    # while starting and refuses to start at all when it cannot, so the frontend
    # image could not run unless a host called `backend` already existed. An
    # image that will not start without an unrelated service is the wrong
    # coupling. It now starts either way, and a request made with no backend
    # behind it fails as a bad gateway, which is the truthful answer.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The API, carried to the backend service on the Compose network.
    #
    # The bundle only ever asks for same-origin relative paths, so this is what
    # makes it work in a container. Doing it here rather than by baking a host
    # into the bundle means the browser makes no cross-origin request and the
    # backend needs no CORS policy. It also keeps the built bundle portable:
    # nothing in it names where the backend lives.
    #
    # Declared before the single page fallback so that an unknown /v1 path
    # returns the backend's own 404 rather than the app shell.
    location /v1/ {
        set $api_backend http://backend:8000;
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploads are bounded by the backend, which counts the body before
        # anything parses it. nginx must not refuse first with its own 1 MB
        # default, or a document under the backend's limit would be rejected
        # here with a different error and no receipt.
        client_max_body_size 64m;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    # The health endpoint, so the frontend container can be checked end to end.
    #
    # The backend serves health at /health, not /v1/health, so the path is
    # rewritten before it is passed on. A URI cannot be carried on a variable
    # upstream the way it can on a literal one, which is why this is a rewrite
    # rather than a longer proxy_pass.
    location = /v1/health {
        set $health_backend http://backend:8000;
        rewrite ^ /health break;
        proxy_pass $health_backend;
        proxy_set_header Host $host;
    }

    # The frontend is a single page app, so unknown paths fall back to the
    # entry document instead of returning 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
