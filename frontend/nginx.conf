server {
    # 8080, not 80. The container runs as UID 101, and an unprivileged
    # process cannot bind a port below 1024. docker-compose.yml maps the host
    # port 5173 onto this one.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The API, carried to the backend service on the compose network.
    #
    # The bundle only ever asks for same-origin relative paths, so this is what
    # makes it work in a container. Doing it here rather than by baking a host
    # into the bundle means the browser makes no cross-origin request and the
    # backend needs no CORS policy. It also keeps the built bundle portable:
    # nothing in it names where the backend lives.
    #
    # Declared before the single page fallback so that an unknown /v1 path
    # returns the backend's own 404 rather than the app shell.
    location /v1/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploads are bounded by the backend, which counts the body before
        # anything parses it. nginx must not refuse first with its own 1 MB
        # default, or a document under the backend's limit would be rejected
        # here with a different error and no receipt.
        client_max_body_size 64m;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    # The health endpoint, so the frontend container can be checked end to end.
    location = /v1/health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # The frontend is a single page app, so unknown paths fall back to the
    # entry document instead of returning 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
